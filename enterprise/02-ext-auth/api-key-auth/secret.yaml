# Each Secret is one API key. The label is how the AuthConfig finds it, so
# adding a client means adding a labelled Secret — no policy change.
apiVersion: v1
kind: Secret
metadata:
  name: team-a-apikey
  namespace: httpbin
  labels:
    extauth: apikey
type: extauth.solo.io/apikey
stringData:
  api-key: "N2YwMDIxZTEtNGUzNS1jNzgz"
  user-id: team-a
