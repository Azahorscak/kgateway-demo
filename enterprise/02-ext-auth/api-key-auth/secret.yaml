# Each Secret is one API key. The label is how the AuthConfig finds it, so
# adding a client means adding a labelled Secret — no policy change.
#
# The client's identity is the *Secret name*. The ext auth server puts it on the
# request as `x-user-id` (and strips the header from the response), which is
# what the per-user rate limit example in ../../03-rate-limiting/ keys on.
apiVersion: v1
kind: Secret
metadata:
  name: team-a
  namespace: httpbin
  labels:
    extauth: apikey
type: extauth.solo.io/apikey
stringData:
  api-key: "N2YwMDIxZTEtNGUzNS1jNzgzLTRkYjAtYjE2YzRkZGVmNjcy"
