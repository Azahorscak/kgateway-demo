# Machine-to-machine: the client already holds a token, so validate it. No
# browser redirect.
#
# accessTokenValidation takes exactly one of `jwt`, `introspection`, or the
# deprecated `introspectionUrl`. This one uses introspection, so it works for
# opaque tokens as well as JWTs.
apiVersion: extauth.solo.io/v1
kind: AuthConfig
metadata:
  name: access-token
  namespace: httpbin
spec:
  configs:
  - oauth2:
      accessTokenValidation:
        introspection:
          introspectionUrl: https://keycloak.example.com/realms/master/protocol/openid-connect/token/introspect
          clientId: my-app
          clientSecretRef:
            name: oidc-client-secret
            namespace: httpbin
        # Require every listed scope. Applies to opaque and JWT tokens alike.
        requiredScopes:
          scope:
          - read
        # Defaults to 10 minutes. Zero disables caching.
        cacheTimeout: 60s
