# An ApiProduct bundles one or more routes into a versioned, consumable product.
# The controller discovers the OpenAPI schemas behind the referenced HTTPRoutes
# and stitches them into a single ApiDoc per version.
apiVersion: portal.solo.io/v1alpha1
kind: ApiProduct
metadata:
  name: httpbin-api
  namespace: httpbin
spec:
  id: httpbin
  displayName: "httpbin API"
  description: "Request and response inspection."
  contactEmail: "platform@example.com"
  versions:
  - name: v1
    targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: httpbin
    openApiMetadata:
      title: "httpbin API v1"
      description: "Request and response inspection."
      license: "Apache-2.0"
