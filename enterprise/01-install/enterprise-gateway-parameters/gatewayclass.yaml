# Referencing the parameters from the GatewayClass makes them the default for
# every Gateway of that class. A Gateway can still override with its own
# spec.infrastructure.parametersRef.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kgateway
spec:
  controllerName: kgateway.dev/kgateway
  parametersRef:
    group: enterprisekgateway.solo.io
    kind: EnterpriseKgatewayParameters
    name: ent-gw-params
    namespace: kgateway-system
