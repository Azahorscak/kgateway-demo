apiVersion: enterprisekgateway.solo.io/v1alpha1
kind: EnterpriseKgatewayTrafficPolicy
metadata:
  name: ratelimit
  namespace: kgateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: http
  entRateLimit:
    global:
      rateLimitConfigRefs:
      - name: ratelimit-config
        namespace: kgateway-system
