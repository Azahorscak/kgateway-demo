apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: csrf
  namespace: httpbin
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: httpbin
  csrf:
    percentageEnabled: 100
    additionalOrigins:
    - exact: trusted.example.com
      ignoreCase: false
