# Send a copy of live traffic to httpbin2. The mirrored response is discarded
# and never affects the client.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-mirror
  namespace: httpbin
spec:
  parentRefs:
  - name: http
    namespace: kgateway-system
  hostnames:
  - mirror.example
  rules:
  - filters:
    - type: RequestMirror
      requestMirror:
        backendRef:
          kind: Service
          name: httpbin2
          port: 8000
    backendRefs:
    - name: httpbin
      port: 8000
