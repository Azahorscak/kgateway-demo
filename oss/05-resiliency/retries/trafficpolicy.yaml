apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: retry
  namespace: httpbin
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: httpbin
  retry:
    attempts: 3
    backoffBaseInterval: 1s
    retryOn:
    - 5xx
    - unavailable
  # A request timeout caps total time across all attempts.
  timeouts:
    request: 20s
