apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: failover-route
  namespace: httpbin
spec:
  parentRefs:
  - name: http
    namespace: kgateway-system
  hostnames:
  - failover.example
  rules:
  - backendRefs:
    - name: failover-backend
      kind: Backend
      group: gateway.kgateway.dev
