# Forwards to whatever host the request's Host header names, resolving DNS at
# request time. Useful as an egress gateway.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: dfp-backend
  namespace: httpbin
spec:
  type: DynamicForwardProxy
  dynamicForwardProxy: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dfp-httproute
  namespace: httpbin
spec:
  parentRefs:
  - name: http
    namespace: kgateway-system
  rules:
  - backendRefs:
    - name: dfp-backend
      group: gateway.kgateway.dev
      kind: Backend
