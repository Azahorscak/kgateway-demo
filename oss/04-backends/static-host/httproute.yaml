apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: static-backend
  namespace: default
spec:
  parentRefs:
  - name: http
    namespace: kgateway-system
  hostnames:
  - static.example
  rules:
  - backendRefs:
    - name: json-backend
      kind: Backend
      group: gateway.kgateway.dev
    # The upstream serves by name, so rewrite the Host header.
    filters:
    - type: URLRewrite
      urlRewrite:
        hostname: jsonplaceholder.typicode.com
