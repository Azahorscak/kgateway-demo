apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-redirect
  namespace: httpbin
spec:
  parentRefs:
  - name: http
    namespace: kgateway-system
  hostnames:
  - redirect.example
  rules:
  # HTTP -> HTTPS on the same host.
  - matches:
    - path:
        type: PathPrefix
        value: /secure
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        port: 443
        statusCode: 301
  # Send an old path to a new host and path.
  - matches:
    - path:
        type: PathPrefix
        value: /legacy
    filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: new.example
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /v2
        statusCode: 302
