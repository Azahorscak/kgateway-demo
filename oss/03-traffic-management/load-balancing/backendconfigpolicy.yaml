# Least-request with slow start, applied to a Kubernetes Service.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: httpbin-lb
  namespace: httpbin
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: httpbin
  loadBalancer:
    leastRequest:
      choiceCount: 3
      slowStart:
        window: 10s
        aggression: "1.5"
        minWeightPercent: 10
